<ul class="nav-list">
    <li *ngFor="let link of links" class="nav-item">
    <!--*ngFor is the for each loop that angular possesses-->
        <a [routerLink]="link.caminhoPagina" class="nav-link">
            {{link.nomeLink}}
        </a>
    <!--All the information that gonna be bind/connected to something must always be between []. For this case, the path of the "a" tag gonna be bind to the object 
        property-->
    </li>
</ul>
